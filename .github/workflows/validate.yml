name: Validate creator skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate.py
      - run: python3 -m unittest discover -s tests -v
